name: Rotar imágenes del README

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar cuadrícula de tecnologías
        run: python scripts/generate_technology_grid.py

      - name: Generar README
        run: python scripts/rotar.py

      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain README.md media/technology-grid.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md media/technology-grid.svg
            git commit -m "Rotar imágenes del README"
            git push
          fi